name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # nixpkgs cannot cross-compile Erlang, so each architecture's image is built on a runner of that architecture.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - run: nix build .#repost-image-${{ matrix.arch }}

      - name: Smoke test
        env:
          ATTR: repost-image-${{ matrix.arch }}
        run: |
          nix run ".#$ATTR.copyToDockerDaemon"
          image=$(nix eval --raw ".#$ATTR.imageRefUnsafe")
          if output=$(docker run --rm "$image" 2>&1); then
            echo "$output"
            echo "expected the image to exit non-zero without configuration" >&2
            exit 1
          fi
          echo "$output"
          grep -q SHIM_ACCESS_KEY_ID <<<"$output"

      # Images travel to the publish job as artifacts, so nothing reaches the registry unless every architecture passed.
      - name: Export
        env:
          ATTR: repost-image-${{ matrix.arch }}
        run: nix run ".#$ATTR.copyTo" -- "oci:image:${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*

      # regctl reads the Docker credentials this writes, so the token stays off the command line.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Install regctl
        run: echo "$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#regclient)/bin" >> "$GITHUB_PATH"

      # The index and its platform manifests are pushed once per tag; the platform manifests go by digest only, so no per-arch tags appear.
      - name: Assemble and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for arch in amd64 arm64; do
            regctl image copy "ocidir://image-$arch:$arch" "ocidir://oci:$arch"
          done
          regctl index create ocidir://oci:latest --ref ocidir://oci:amd64 --ref ocidir://oci:arm64
          regctl manifest get ocidir://oci:latest
          while read -r tag; do
            [ -n "$tag" ] || continue
            regctl image copy ocidir://oci:latest "$tag"
          done <<<"$TAGS"
