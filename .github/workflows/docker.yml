name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # skopeo, behind copyTo, falls back to the Docker credentials this writes, so the token never appears on a command line that copyTo echoes.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - run: nix build .#repost-image

      - name: Smoke test
        run: |
          nix run .#repost-image.copyToDockerDaemon
          image=$(nix eval --raw .#repost-image.imageRefUnsafe)
          if output=$(docker run --rm "$image" 2>&1); then
            echo "$output"
            echo "expected the image to exit non-zero without configuration" >&2
            exit 1
          fi
          echo "$output"
          grep -q SHIM_ACCESS_KEY_ID <<<"$output"

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            nix run .#repost-image.copyTo -- "docker://$tag"
          done <<<"$TAGS"
