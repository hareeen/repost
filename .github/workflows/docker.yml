name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # nixpkgs cannot cross-compile Erlang, so each architecture's image is built on a runner of that architecture.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # skopeo, behind copyTo, falls back to the Docker credentials this writes, so the token never appears on a command line that copyTo echoes.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: nix build .#repost-image-${{ matrix.arch }}

      - name: Smoke test
        env:
          ATTR: repost-image-${{ matrix.arch }}
        run: |
          nix run ".#$ATTR.copyToDockerDaemon"
          image=$(nix eval --raw ".#$ATTR.imageRefUnsafe")
          if output=$(docker run --rm "$image" 2>&1); then
            echo "$output"
            echo "expected the image to exit non-zero without configuration" >&2
            exit 1
          fi
          echo "$output"
          grep -q SHIM_ACCESS_KEY_ID <<<"$output"

      # The per-arch tag is only the input to the merge job's index; users pull the multi-arch tags.
      - name: Push
        env:
          ATTR: repost-image-${{ matrix.arch }}
          TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: nix run ".#$ATTR.copyTo" -- "docker://$IMAGE:$TAG"

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # regctl reads the Docker credentials this writes, so the token stays off the command line.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Push index
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            nix shell --inputs-from . nixpkgs#regclient -c \
              regctl index create "$tag" \
              --ref "$IMAGE:$SHA-amd64" \
              --ref "$IMAGE:$SHA-arm64"
          done <<<"$TAGS"
